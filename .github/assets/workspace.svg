<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none">
  <title>Ribbon workspace</title><desc>A layout illustration with notes, a browser, and messages arranged side by side.</desc>
  <style>text{font-family:-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}.muted{fill:#68707c}.title{fill:#20242c;font-weight:500;letter-spacing:-.6px}.body{fill:#5d6470;font-size:17px}.small{fill:#68707c;font-size:13px}</style>
  <rect x=".5" y=".5" width="1199" height="479" rx="28" fill="#f7f8fa" stroke="#e2e5eb"/>
  <g fill="white" stroke="#e2e5eb"><rect x="24" y="24" width="302" height="432" rx="14"/><rect x="338" y="24" width="510" height="432" rx="14"/><rect x="860" y="24" width="316" height="432" rx="14"/></g>
  <g stroke="#eceef2"><path d="M24 66H326M338 66H848M860 66H1176"/></g>
  <g fill="#ff6159"><circle cx="43" cy="45" r="4"/><circle cx="357" cy="45" r="4"/><circle cx="879" cy="45" r="4"/></g>
  <g fill="#ffc045"><circle cx="57" cy="45" r="4"/><circle cx="371" cy="45" r="4"/><circle cx="893" cy="45" r="4"/></g>
  <g fill="#3bc94a"><circle cx="71" cy="45" r="4"/><circle cx="385" cy="45" r="4"/><circle cx="907" cy="45" r="4"/></g>
  <g class="small"><text x="94" y="50">Notes</text><text x="408" y="50">Browser</text><text x="930" y="50">Messages</text></g>
  <text class="small" x="50" y="109">Saturday / A little time away</text>
  <text class="title" x="50" y="156" font-size="27">Weekend plans</text>
  <g class="body"><text x="50" y="208">Find a place by the water</text><text x="50" y="238">Book a table for two</text><text x="50" y="268">Leave the afternoon open</text></g>
  <path d="M50 310H300" stroke="#eceef2"/>
  <g class="body"><text x="50" y="350">A few good things.</text><text x="50" y="377">Nothing too planned.</text></g>
  <text class="small" x="364" y="109">NORTH / A journal of small escapes</text>
  <g class="title" font-size="34"><text x="364" y="157">A weekend</text><text x="364" y="195">by the water.</text></g>
  <svg x="364" y="221" width="458" height="136" viewBox="0 0 458 136"><defs><clipPath id="sea"><rect width="458" height="136" rx="8"/></clipPath></defs><g clip-path="url(#sea)"><rect width="458" height="136" fill="#e9eef5"/><path d="M0 62Q60 29 133 62T282 54T458 48V136H0Z" fill="#cedce2"/><path d="M0 104Q88 116 177 73T331 77T458 70V136H0Z" fill="#97acbe"/><path d="M0 123Q83 88 185 113T336 108T458 103V136H0Z" fill="#2856ed"/><circle cx="385" cy="24" r="13" fill="white"/></g></svg>
  <text class="small" x="364" y="389">A slower plan for Saturday.</text>
  <circle cx="903" cy="111" r="17" fill="#f1f2f5"/><text class="muted" x="897" y="117" font-size="15">M</text><text x="932" y="117" fill="#20242c" font-size="17" font-weight="500">Maya</text>
  <rect x="886" y="151" width="264" height="86" rx="16" fill="#f1f2f5"/>
  <g fill="#20242c" font-size="17"><text x="904" y="182">The place looks great.</text><text x="904" y="209">Shall we go?</text></g>
  <rect x="886" y="259" width="264" height="54" rx="16" fill="#2856ed"/>
  <text x="904" y="292" fill="white" font-size="17">Saturday sounds good.</text>
  <text class="small" x="1095" y="344">Delivered</text>
</svg>
