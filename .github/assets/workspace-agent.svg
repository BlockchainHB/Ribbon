<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" fill="none">
  <title>Ribbon: your agents, right beside your work</title>
  <desc>Illustrative agent, editor, and browser windows in a horizontal workspace that continues beyond the screen.</desc>
  <defs><clipPath id="viewport"><rect x="24" y="24" width="1152" height="432" rx="14"/></clipPath></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;letter-spacing:0}.muted{fill:#5d6470;font-size:17px}.title{fill:#20242c;font-weight:500}.small{fill:#5d6470;font-size:13px}.code{fill:#596473;font-size:16px}.code text{font-family:Menlo,Monaco,monospace}</style>
  <rect x=".5" y=".5" width="1199" height="479" rx="28" fill="#f7f8fa" stroke="#e2e5eb"/>
  <g clip-path="url(#viewport)">
    <g fill="white" stroke="#dcdde2"><rect x="24" y="24" width="302" height="432" rx="14"/><rect x="338" y="24" width="510" height="432" rx="14"/><rect x="860" y="24" width="240" height="432" rx="14"/><rect x="1112" y="24" width="302" height="432" rx="14"/></g>
    <g stroke="#eceef2"><path d="M24 66H326M338 66H848M860 66H1100M1112 66H1414"/></g>
    <g fill="#ff6159"><circle cx="43" cy="45" r="4"/><circle cx="357" cy="45" r="4"/><circle cx="879" cy="45" r="4"/><circle cx="1131" cy="45" r="4"/></g>
    <g fill="#ffc045"><circle cx="57" cy="45" r="4"/><circle cx="371" cy="45" r="4"/><circle cx="893" cy="45" r="4"/><circle cx="1145" cy="45" r="4"/></g>
    <g fill="#3bc94a"><circle cx="71" cy="45" r="4"/><circle cx="385" cy="45" r="4"/><circle cx="907" cy="45" r="4"/><circle cx="1159" cy="45" r="4"/></g>
    <g class="small"><text x="94" y="50">Codex</text><text x="408" y="50">IDE · Ribbon</text><text x="930" y="50">Preview</text></g>
    <text class="title" font-size="23"><tspan x="48" y="111">Build the new</tspan><tspan x="48" y="140">homepage</tspan></text>
    <rect x="48" y="160" width="254" height="86" rx="14" fill="#f5f6f8"/>
    <g class="muted"><text x="64" y="192">Keep the layout simple.</text><text x="64" y="220">Make the work the focus.</text><text x="48" y="288">I’ll update the hero, then</text><text x="48" y="316">check the browser.</text></g>
    <text class="small" x="48" y="375">Editing index.astro</text>
    <text class="small" x="364" y="113">src / pages / index.astro</text>
    <g class="code" xml:space="preserve"><text x="364" y="170">01  &lt;section class="hero"&gt;</text><text x="364" y="204">02    &lt;h1&gt;</text><text x="364" y="238" fill="#2856ed">03      Your agents,</text><text x="364" y="272" fill="#2856ed">04      right beside your work.</text><text x="364" y="306">05    &lt;/h1&gt;</text><text x="364" y="340">06    &lt;DownloadLink /&gt;</text><text x="364" y="374">07  &lt;/section&gt;</text></g>
    <g class="title" font-size="27" text-anchor="middle"><text x="980" y="186">Your agents,</text><text x="980" y="221">right beside</text><text x="980" y="256">your work.</text></g>
    <rect x="920" y="287" width="120" height="40" rx="8" fill="#2856ed"/><text x="980" y="313" text-anchor="middle" fill="white" font-size="16">Download</text>
  </g>
</svg>
